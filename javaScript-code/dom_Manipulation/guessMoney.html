<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess Money</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
       #heading {
            color: black;
            text-align: center;
        }
        .btn {
            height: 30px;
            width: 90px;
        }

    </style>
</head>
<body>
    <h1 id="heading">Guess the box which have Money</h1>
    <button id="btn1" class="btn"></button>
    <button id="btn2" class="btn"></button>
    <button id="btn3" class="btn"></button>
    <button id="btn4" class="btn"></button>

    <script>
        let allButtons = document.querySelectorAll(".btn");
        let winnerPosition = Math.floor(Math.random() * 4)

        function handleClick() {
            for(let i = 0; i < allButtons.length; i++) {
                if(i === winnerPosition) {
                    allButtons[i].innerText = '$500';
                } else {
                    allButtons[i].innerText = 'loser';
                }
            }
        }
        for(let x = 0; x < allButtons.length; x++) {
            allButtons[x].addEventListener("click", handleClick);   
        }
    </script>
</body>
</html>
